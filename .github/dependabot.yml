version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "00:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    ignore:
      # @types/node tracks the Node version in .node-version, not the latest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "monthly"
      time: "00:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
