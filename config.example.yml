# Copy this file to local/config.yml, then edit the copy.
#
#     cp config.example.yml local/config.yml
#
# Keep your copy in `local/`. That directory is git-ignored, and a calendar
# address is a credential.

# ── The bar ───────────────────────────────────────────────────────────────────

device:
  # The address of the bar, printed on its back cover. Each bar has its own.
  address: 10.0.4.20

# ── The programs to run ───────────────────────────────────────────────────────
run:
  # - hello-world
  # - random-emoji
  # - focus
  # - event

# ── Program settings ──────────────────────────────────────────────────────────
programs:
  # Interrupts you before an appointment starts.
  # What each setting does: src/programs/event/README.md#settings
  event:
    # The calendars to watch, as https URLs or paths to .ics files. Give at
    # least one. This program shows nothing until an appointment is near, so a
    # program with no calendar looks exactly like one that works.
    # calendars:
    #   # work
    #   - https://calendar.google.com/calendar/ical/…/basic.ics
    #   - https://calendar.google.com/calendar/ical/…/basic.ics
    #   # personal
    #   - local/personal.ics

    # The minutes between reads of the calendars. This is the longest an
    # appointment added elsewhere can take to reach the bar.
    refresh: 5

    # The hours a read that fails keeps drawing what the last read that worked
    # found. After that, the bar shows the failure instead.
    stale: 24

    # Whether an entry whose calendar carries no alarm of its own is given one
    # at its start, so that every appointment has at least one. Most entries in
    # a real calendar carry none, so turning this off makes the bar speak only
    # about the ones that asked.
    ensure_alarms: true

    # When an alert is on screen, in seconds either side of the instant the
    # calendar asked to be reminded at. `before` is how far ahead of it the
    # bar starts warning you; `until` is how long it stays up afterwards while
    # nobody answers it.
    screen:
      before: 300
      until: 120

    # When that alert makes a noise, in seconds either side of the same
    # instant, and how often it repeats. Most of an alert is meant to be
    # silent, so `before` is much shorter than the screen's. `every` has to be
    # more than zero: a repeat with no gap in it is a bar chiming as fast as it
    # can manage.
    chime:
      before: 30
      until: 120
      every: 10

  # Shows the focus block you are in and the time left of it.
  # What each setting does: src/programs/focus/README.md#settings
  focus:
    # The iCalendar feed to read focus blocks from, as an https URL or the path
    # to an .ics file. With no feed, the file below is read instead.
    # calendar: https://calendar.google.com/calendar/ical/…/basic.ics

    # The schedule file, relative to the working directory. It is read when no
    # calendar is set. When one is set, it is written on each start instead.
    file: local/focus.json
